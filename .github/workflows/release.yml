name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package portable Windows build
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build-requirements.txt

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $source = Get-Content app.py -Raw
          if ($source -notmatch 'APP_VERSION\s*=\s*"([^"]+)"') {
            throw "APP_VERSION was not found in app.py"
          }
          $expectedTag = "v$($matches[1])"
          if ($expectedTag -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match app.py version $expectedTag"
          }

      - name: Download FFmpeg
        shell: pwsh
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip
          FFMPEG_SHA256: b3b581e72328e8f956f75895e54d7ccc4ffe6cd7211c4954203815eec885b68a
        run: |
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile ffmpeg.zip
          $actualHash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:FFMPEG_SHA256) {
            throw "FFmpeg checksum mismatch: $actualHash"
          }
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-dist

          $ffmpeg = Get-ChildItem -Path ffmpeg-dist -Filter ffmpeg.exe -Recurse |
            Select-Object -First 1
          if (-not $ffmpeg) {
            throw "ffmpeg.exe was not found in the downloaded archive"
          }

          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item $ffmpeg.FullName release\ffmpeg.exe

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name YouTubeDownloader `
            --icon icon.ico `
            --add-data "icon.ico;." `
            --collect-all yt_dlp `
            --collect-all instaloader `
            app.py

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name Updater `
            --icon icon.ico `
            --add-data "icon.ico;." `
            updater.py

          Copy-Item `
            dist\Updater.exe `
            dist\YouTubeDownloader\Updater.exe `
            -Force
          Copy-Item dist\YouTubeDownloader\* release\ -Recurse -Force
          Copy-Item README.md release\README.md
          Copy-Item icon.png release\icon.png

          @"
          YouTube Downloader portable package

          Keep all files and folders together, then run YouTubeDownloader.exe.
          Python is already bundled into the executable.
          ffmpeg.exe is included for video merging and audio conversion.
          Instagram media uses yt-dlp first, with Instaloader as a fallback. Optional
          Instagram login supports account-accessible private media and stories.
          Updater.exe checks GitHub Releases, verifies SHA-256, preserves
          settings.json and instagram.session, then restarts the updated application.
          "@ | Set-Content -Path release\START-HERE.txt -Encoding UTF8

      - name: Sign executable (optional)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            Write-Host "Signing skipped: certificate secrets are not configured."
          } else {
            $certificatePath = Join-Path $env:RUNNER_TEMP "yt-downloader-signing.pfx"
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
            )

            $signTool = Get-ChildItem `
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object FullName |
              Select-Object -Last 1
            if (-not $signTool) {
              throw "signtool.exe was not found on the runner"
            }

            & $signTool.FullName sign `
              /fd SHA256 `
              /f $certificatePath `
              /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /tr "http://timestamp.digicert.com" `
              /td SHA256 `
              release\YouTubeDownloader.exe
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode signing failed for YouTubeDownloader.exe"
            }
            & $signTool.FullName sign `
              /fd SHA256 `
              /f $certificatePath `
              /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /tr "http://timestamp.digicert.com" `
              /td SHA256 `
              release\Updater.exe
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode signing failed for Updater.exe"
            }
            Remove-Item $certificatePath -Force
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path release\* `
            -DestinationPath YouTubeDownloader-windows-x64.zip `
            -CompressionLevel Optimal `
            -Force

      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          $zipHash = (Get-FileHash YouTubeDownloader-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash release\YouTubeDownloader.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $updaterHash = (Get-FileHash release\Updater.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $ffmpegHash = (Get-FileHash release\ffmpeg.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$zipHash  YouTubeDownloader-windows-x64.zip"
            "$exeHash  YouTubeDownloader.exe (inside ZIP)"
            "$updaterHash  Updater.exe (inside ZIP)"
            "$ffmpegHash  ffmpeg.exe (inside ZIP)"
          ) | Set-Content -Path SHA256SUMS.txt -Encoding ASCII

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-windows-x64
          path: |
            YouTubeDownloader-windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            YouTubeDownloader-windows-x64.zip `
            SHA256SUMS.txt `
            --title "YouTube Downloader ${{ github.ref_name }}" `
            --generate-notes
